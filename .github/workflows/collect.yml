name: Collect academic feeds
on:
  schedule:
    - cron: '17 18 * * *' # 03:17 Asia/Seoul (18:17 UTC previous day); offset from top of hour to reduce GitHub scheduler contention
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect.yml'
      - 'src/import-cloudflare.mjs'
      - 'src/fetch-cloudflare.mjs'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: academic-pages
  cancel-in-progress: false
jobs:
  import-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch all Cloudflare pages
        run: node src/fetch-cloudflare.mjs /tmp/cloudflare.json
      - name: Import English articles (no AI API)
        run: node src/import-cloudflare.mjs /tmp/cloudflare.json
      - name: Commit English articles and remove expired entries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/en.json docs/data/ko.json
          if ! git diff --cached --quiet; then
            git commit -m "Mirror Cloudflare academic articles"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
