name: Publish translated feed
on:
  push:
    branches: [main]
    paths:
      - 'docs/data/ko.json'
      - 'docs/app.js'
      - 'docs/style.css'
      - 'docs/index.html'
      - 'docs/en/**'
      - 'docs/ko/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: academic-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
